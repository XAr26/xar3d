# Railway Nixpacks — Laravel Backend
# PHP 8.3 + PostgreSQL + semua extension yang diperlukan
# Cara yang benar: pakai NIXPACKS_PHP_VERSION bukan nama nixpkgs manual

[variables]
NIXPACKS_PHP_VERSION = "8.3"

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --no-scripts"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan storage:link --force 2>/dev/null; php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
