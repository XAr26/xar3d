# Railway Nixpacks — Next.js Frontend
# Node.js 22 LTS (versi terbaru stabil)
# Railway akan baca .nvmrc atau field engines di package.json secara otomatis

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start -- -p ${PORT:-3000}"
